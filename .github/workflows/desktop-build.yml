name: Build local desktop packages

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/desktop-build.yml"
      - "backend/**"
      - "desktop/**"
      - "desktop_launcher.py"
      - "frontend/**"
      - "requirements*.txt"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: SinoImageTool-Windows-x64
          - os: macos-14
            artifact: SinoImageTool-macOS-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install -r requirements-desktop.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build desktop package
        run: python desktop/build.py

      - name: Test Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/SinoImageTool/SinoImageTool.exe").Path
          foreach ($mode in @("--self-test", "--server-self-test")) {
            $process = Start-Process -FilePath $exe -ArgumentList $mode -Wait -PassThru
            if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          }

      - name: Test macOS package
        if: runner.os == 'macOS'
        run: |
          dist/SinoImageTool.app/Contents/MacOS/SinoImageTool --self-test
          dist/SinoImageTool.app/Contents/MacOS/SinoImageTool --server-self-test
          ditto -c -k --sequesterRsrc --keepParent \
            dist/SinoImageTool.app \
            dist/SinoImageTool-macOS-arm64.zip

      - name: Upload Windows package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/SinoImageTool-Windows-x64.zip
          if-no-files-found: error

      - name: Upload macOS package
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/SinoImageTool-macOS-arm64.zip
          if-no-files-found: error
